[General]
; Master-Schalter für die Mod
bEnabled=1

[Controls]
; Aktivierungstaste als Windows Virtual-Key-Code (dezimal)
; 81 = Q (Standard), 86 = V, 20 = Feststelltaste
; Vollständige Liste: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
iActivationKey=81

; Die echte Scanner-Taste aus den Spieleinstellungen (Standard: Q = 81).
; Wird beim Sperren eines Ziels als simulierter Tastendruck gesendet, damit
; der Scanner mit der normalen Animation/dem Sound schließt statt abrupt zu
; verschwinden. MUSS manuell mit der tatsächlichen Spiel-Keybind
; übereinstimmen - wird nicht automatisch aus den Spieleinstellungen gelesen.
iScannerToggleKey=81

; Wie der Scanner beim Sperren eines Ziels geschlossen wird:
;   0 = gar nicht schließen
;   1 = simulierter Druck der Scanner-Taste (schöne Animation/Sound, steht
;       aber seit 2026-08-22 unter Verdacht, direkte Freezes/Crashes ohne
;       Log auszulösen - genau einen Frame nach dem injizierten Tastendruck)
;   2 = internes UI-Kommando (kHide): abrupt, ohne Animation, aber die
;       zuvor nachweislich stabile Methode (Standard)
iScannerCloseMode=2

; Die echte "Zurück"-Taste aus den Spieleinstellungen (Standard: Tab = 9).
; Dieselbe Taste, die auch das Charaktermenü (DataMenu) öffnet, wenn nichts
; anderes offen ist. Wird bei aktivem VATS-Lock abgefangen, damit der erste
; Druck nur VATS beendet statt gleichzeitig das Charaktermenü zu öffnen.
iBackKey=9

; Beendet den aktiven VATS-Lock sofort, sobald manuell gezielt (ADS) wird -
; statt zu versuchen, ADS selbst zu blockieren (vier Ansätze dafür sind
; gescheitert, siehe AdsBlocker.h). Alexanders eigener Vorschlag 2026-08-24.
bEndLockOnAds=1

; Die echte Zielen-Taste als Windows Virtual-Key-Code (2 = rechte Maustaste,
; Standard). Nur Maustasten werden erkannt.
iAdsButton=2

[Targeting]
; Öffnungswinkel des Ziel-Kegels in Grad (Halbwinkel zur Blickrichtung)
; Standard 35 statt 20 - 20 war spürbar zu eng, echte Fehlschüsse bei 21-24°
iConeDegrees=35
; Maximale Zielreichweite in Spiel-Welteinheiten
iMaxRange=5000

; Horizontales Sichtfeld in Grad, passend zu Bethesdas eigener Konvention
; (Starfields "fFPGeometryFOV:Camera" ist horizontal, Standard 90). Wird
; benutzt, um die HUD-Projektion selbst zu berechnen - die Kamera der
; Engine liess sich im Speicher nicht auffinden. Muss mit der tatsaechlich
; im Spiel eingestellten Sichtweite uebereinstimmen, sonst sitzen Ziel-Box
; und Leisten daneben.
iCameraFovDegrees=90

; Wo auf dem Ziel die Box sitzt und wohin Geschosse gelenkt werden -
; als Vielfaches der Hoehe, auf der der Mittelpunkt der Huellkugel des
; Ziels ohnehin schon ueber dessen Fuessen liegt.
;   1.0 = der rohe Mittelpunkt. Das ist die geometrische Mitte des ganzen
;         Koerpers, bei einem stehenden Menschen also Huefthoehe - sichtbar
;         zu tief.
;   1.5 = ungefaehr Brusthoehe (Standard).
; Bewusst ein Faktor statt eines festen Abstands: Starfields nicht-
; menschliche Kreaturen haben voellig unterschiedliche Formen, ein Faktor
; skaliert mit dem jeweiligen Koerper mit, waehrend ein fester "Brust-
; Offset" menschliche Proportionen unterstellt und bei einer flachen,
; breiten Kreatur ueber ihr landen wuerde. Zusaetzlich auf die Oberkante
; der Huellkugel begrenzt. Gegen nicht-menschliche Gegner noch UNGETESTET
; (Stand 2026-08-25) - auf 1.0 setzen stellt exakt das alte Verhalten
; wieder her, ohne Neubau.
fAimPointHeightFactor=1.25

; Blendet Begleiter (Teammitglieder des Spielers) beim Anvisieren aus.
; Gemessen, nicht geraten: ein Begleiter und ein Feind unterschieden sich
; in genau einem Bit der Statusbits (0x04000000 = kPlayerTeammate).
; Das ist KEINE vollstaendige Fraktionspruefung - neutrale Zivilisten
; bleiben anvisierbar. Die Engine-Funktion dafuer (IsHostileToActor) hat
; Address-Library-ID 0, ist also nicht aufrufbar.
bIgnoreFriendlyActors=1

; Strenger: nur Gegner, die aktuell gegen den Spieler kaempfen. Schliesst
; auch neutrale Zivilisten aus - aber ebenso Feinde, die einen noch nicht
; bemerkt haben, ein Stealth-Auftakt ist damit nicht mehr moeglich.
bRequireHostileTarget=0

[Combat]
; Geschossgeschwindigkeit (m/s), die waehrend eines VATS-Locks erzwungen
; wird. Normale Kugeln fliegen 500 m/s und erreichen ihr Ziel auf typische
; Kampfdistanz (~6m) innerhalb EINES einzigen Frames - die Engine
; aktualisiert ein Projektil nur einmal pro Frame, es gibt also gar keinen
; Moment, in dem die Flugbahn noch umgelenkt werden koennte. Genau deshalb
; hat der Redirect bei (langsamen) Raketen immer funktioniert und bei
; Schusswaffen nie. Ein niedrigerer Wert gibt dem Geschoss echte Flugzeit
; zum Nachfuehren. 0 = deaktiviert (Originalgeschwindigkeit bleibt).
fLockedProjectileSpeed=80.0

; Die folgenden drei Werte sind seit 2026-08-25 UNGENUTZT - die
; Wuerfel-/Chance-Logik wurde entfernt, ein Schuss wird jetzt immer zum
; Ziel gelenkt (nur ein echtes Hindernis stoppt ihn). Bleiben stehen, bis
; die Treffermechanik selbst steht.
iCenterHitChancePercent=95
fFullChanceRangeMeters=12.0
fMaxEffectiveRangeMeters=45.0

[HUD]
; Blendet das native Fadenkreuz UND die Damage-Numbers bei aktivem
; VATS-Lock aus (unsere eigene Ziel-Box/HUD ersetzt beides). Fadenkreuz
; bestätigt funktionierend (bCrosshairEnabled:GamePlay); Damage-Numbers
; schaltet den echten "Show Damage Numbers"-Schalter aus den
; Interface-Einstellungen um (bDamageNumbersEnabled:Interface).
bHideCrosshairWhileLocked=1

; Zeigt die aktuelle/maximale Leben-Anzeige des gesperrten Ziels in der HUD-Box.
bShowTargetHealth=1

; Groesse der Ziel-Box, als Anteil des projizierten Radius der Huellkugel
; des Ziels. Die Kugel umschliesst den GANZEN Koerper - 1.0 wuerde also
; den kompletten Gegner einrahmen, viel groesser als gewollt. 0.20 ist so
; geeicht, dass die Box aus der Naehe genauso aussieht wie die frueheren
; festen 36 Pixel, und mit zunehmender Entfernung kleiner wird, statt
; gleich zu bleiben waehrend der Gegner schrumpft. Groesser = die Box
; umschliesst mehr vom Koerper.
fTargetBoxScale=0.20

; Wie lange die Hit-/Kill-/Crit-Anzeigen des Spiels nach Modusende
; unterdrueckt bleiben, in Millisekunden. Zurueckgesetzt wird, sobald die
; Animation von selbst zum Stillstand kommt; dies ist die Obergrenze fuer
; den Fall, dass sie es nicht tut. Ein Kompromiss: das Spiel loest Crit-
; Ereignisse teils Sekunden nach dem Kill aus, unbegrenzt unterdruecken
; wuerde die normale Anzeige dauerhaft kaputtmachen.
iHudRestoreDelayMs=2500

; Statt die Crit-Anzeige auszublenden, verschieben. Standardmaessig aus -
; das Koordinatensystem des HUD ist unbekannt, ein blind geratener Versatz
; koennte die Anzeige aus dem Bild schieben. Mit 0 wird stattdessen einmal
; pro Sitzung die aktuelle Position ins Log geschrieben, woraus sich die
; Werte unten ableiten lassen.
bMoveCritMarker=0
fCritMarkerOffsetX=0.0
fCritMarkerOffsetY=-180.0

[Resource]
; Die VATS-Leiste. Zwei Spielerwerte mit je eigener Rolle, statt einer
; verrechneten Mischzahl:
;   - Die VOLLEN Lebenspunkte bestimmen, wie gross die Leiste ist.
;   - Der VOLLE Sauerstoff bestimmt, wie schnell sie sich wieder fuellt.
; Bewusst die Maximalwerte, nicht die aktuellen: sonst entstuende eine
; Abwaertsspirale (verletzt = weniger VATS = noch verletzter), und die
; Skala der Leiste wuerde mitten im Kampf springen. Perks, Ausruestung und
; Nahrung wirken trotzdem, weil sie die Maximalwerte anheben.
bEnabled=1

; Kapazitaet = volle Lebenspunkte x diesem Wert. Bei 1.0 und 1820 max. HP
; sind das 1820 Schadenspunkte pro voller Leiste, also grob vier Gegner
; mit je 480 HP. Kleiner = VATS wird knapper.
fCapacityPerHealth=1.0

; Nachfuellrate pro Sekunde = voller Sauerstoff x diesem Wert. Bei 0.5 und
; 270 max. O2 sind das 135 Punkte/Sekunde, die 1820er Leiste ist also in
; rund 13 Sekunden ausserhalb von VATS wieder voll. Nachgefuellt wird NUR
; im ausgeschalteten Zustand.
fRefillPerOxygen=0.5

; Was ein Schadenspunkt kostet. Abgezogen wird der tatsaechlich verursachte
; Schaden (gemessen am Lebensverlust des Ziels, also inklusive Ruestungs-
; abzug), nicht die Anzahl der Treffer - eine Automatikwaffe landet fuer
; dieselbe Wirkung viel mehr Treffer als eine halbautomatische, pro Treffer
; abzurechnen wuerde also die Feuerrate bestrafen statt den Nutzen.
; 2.0 seit 2026-08-25: bei 1.0 leerte sich die Leiste im Test zu langsam.
fCostPerDamage=2.0

; Wechselt beim Tod des Ziels automatisch zum naechsten lebenden Gegner,
; solange noch Kapazitaet uebrig ist - statt VATS ganz zu beenden. Der
; Ressourcenverbrauch ist die Bremse: jeder weitere Gegner muss ueber
; verursachten Schaden bezahlt werden, die Kette endet also von selbst.
; ABGESCHALTET 2026-08-25: die Funktion selbst arbeitet, aber die Auswahl
; des naechsten Ziels nicht - ohne echte Sichtlinienpruefung werden Gegner
; hinter Waenden und auf anderen Etagen gewaehlt. Drei Filter wurden
; probiert (Fadenkreuz-Ziel, "kaempft gegen mich", Bildschirmsichtbarkeit),
; keiner davon ersetzt eine echte Verdeckungspruefung. Bleibt aus, bis die
; Tiefenpuffer-Methode steht - siehe HANDOFF.md.
bAutoAdvanceOnKill=0

; Wie weit der automatische Wechsel sucht, in Metern. Bewusst viel kuerzer
; als die normale Zielreichweite - ein Sprung quer durch den Raum waere
; eine Ueberraschung statt einer Hilfe. Der normale Sichtkegel
; (iConeDegrees) gilt zusaetzlich, der Spieler muss also grob hinschauen.
fAutoAdvanceRangeMeters=30.0

; Nur zu dem wechseln, was die spieleigene Fadenkreuz-Abfrage meldet
; (der Wert hinter der "E zum Interagieren"-Anzeige). Bauartbedingt
; wandsicher, reicht aber nur bis Interaktionsdistanz - in der Praxis
; loeste der Wechsel damit fast nie aus. Daher standardmaessig aus.
bAutoAdvanceRequireCrosshair=0

; Nur zu Gegnern wechseln, die aktuell gegen den Spieler kaempfen.
; Ersatz fuer die fehlende Sichtlinienpruefung - reicht aber nicht gegen
; Waende, siehe bAutoAdvanceOnKill oben.
bAutoAdvanceRequireEngaged=1

; Eigener, weiterer Sichtkegel fuer den Wechsel. Beim Anvisieren zielt man
; bewusst, da sind 35 Grad grosszuegig; beim Wechsel zeigt man noch auf den
; gerade Gefallenen, der naechste Gegner kann weit seitlich stehen.
iAutoAdvanceConeDegrees=60

; Wie lange der Lock nach einem Kill offen bleibt und auf ein neues Ziel
; wartet, in Millisekunden. Waehrenddessen wird nichts gezeichnet.
iAutoAdvanceGraceMs=1200
